#spring.application.name=PostService
#
## MongoDB connection (note port 51026)
#spring.data.mongodb.uri=mongodb://root:secret@localhost:51026/MindConnectPostDB?authSource=admin
#spring.data.mongodb.database=MindConnectPostDB


spring.application.name=PostService

# Disable Docker Compose auto integration
spring.docker.compose.enabled=false

#mongodb://<username>:<password>@<host>:<port>/<database>?authSource=<authDB>
# MongoDB connection (running in Docker)
spring.data.mongodb.uri=mongodb://root:secret@localhost:51026/MindConnectPostDB?authSource=admin
spring.data.mongodb.database=MindConnectPostDB

spring.data.mongodb.auto-index-creation=false


spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.properties.spring.json.add.type.headers=false
